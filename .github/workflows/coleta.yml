name: Coleta diária

on:
  schedule:
    - cron: "0 9 * * *"   # 06:00 em Brasília
  workflow_dispatch:
    inputs:
      forcar:
        description: "Recoletar todos os anos (ignora cache)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["coletor/**", ".github/workflows/coleta.yml", "requirements.txt"]

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Coletar dados
        env:
          FORCAR: ${{ inputs.forcar && '1' || '0' }}
        run: python -m coletor 2>&1 | tee data/ultima_execucao.log
      - name: Salvar dados no repositório
        if: always()
        run: |
          git config user.name "coleta-automatica"
          git config user.email "coleta-automatica@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Dados atualizados em $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main || true
          git push
